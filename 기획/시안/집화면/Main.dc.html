  <main style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

    <article style="background: #FFFFFF; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; color: #4A5B6D">자리를 비운 3시간 동안</span>
      <p style="margin: 0; font-size: 17px; font-weight: 700; line-height: 1.4">처음으로 <span style="color: #1F5F99">[희귀]</span> 바람결 장궁을 찾았어요</p>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 13px">

        <span style="color: #4A5B6D">전투력</span><span style="text-align: right; font-weight: 500">816 → 1,054 <span style="color: #2F7A3E">+238</span></span>
        <span style="color: #4A5B6D">골드</span><span style="text-align: right; font-weight: 500">+6,800</span>

        <span style="font-size: 12px; color: #4A5B6D">다음 귀환까지 4분</span>
      </div>
      <div style="height: 6px; background: #DCE6F0; border-radius: 3px"><div style="width: 42%; height: 6px; background: #3D86C6; border-radius: 3px"></div></div>
      <span style="font-size: 12px; color: #4A5B6D">네뷸라 농도 1,033 · 내 전투력 1,054</span>
    </article>

    <article style="background: #FFFFFF; border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #4A5B6D">다음 관문</span>
        <span style="font-size: 15px; font-weight: 700">두 번째 폭풍의 벽까지 구름층 17개</span>
      </div>
      <span style="font-size: 13px; font-weight: 500; color: #4A5B6D">23 / 40</span>

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 14 C8 8 12 16 20 10"></path><path d="M4 19 C8 13 12 21 20 15"></path><path d="M4 9 C8 3 12 11 20 5"></path></svg>던전</a>
