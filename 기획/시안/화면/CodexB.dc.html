      known: known && st.tab === 'gear', cost: cost,
      btnText: can ? '만들기' : '재료가 모자라요', btnBg: can ? '#3D86C6' : 'transparent', btnColor: can ? '#FFFFFF' : '#8C9AB0', btnBorder: can ? 'none' : '1px solid #3A4658' };
    const tabs = [['gear', '장비'], ['mon', '적'], ['skill', '기술'], ['deco', '장식']].map((x) => ({ label: x[1], on: st.tab === x[0],
      border: st.tab === x[0] ? '#8CC4F5' : '#3A4658', bg: st.tab === x[0] ? '#1F3550' : 'transparent', pick: () => this.setState({ tab: x[0], sel: 0 }) }));
    const chip = (t, on) => ({ t: t, border: on ? '#8CC4F5' : '#3A4658', bg: on ? '#1F3550' : 'transparent' });
    const filters = st.tab === 'skill' ? [chip('사냥꾼', true), chip('전사', false), chip('마법사', false)] : st.tab === 'deco' ? [chip('전체', true), chip('기념품', false)] : st.tab === 'mon' ? [chip('전체', true), chip('1~20층', false), chip('21~40층', false), chip('우두머리', false)] : [chip('전체', true), chip('궁술', false), chip('만들 수 있음', false), chip('전설', false)];
    const done = list.filter((x) => x[5]).length;
    return { cells: cells, sel: sel, tabs: tabs, filters: filters, progress: st.tab === 'skill' ? '세 직업 기술 18종' : noun + ' ' + done + ' / ' + ({ mon: 64, gear: 180, deco: 40 }[st.tab]) };
  }
}
</script>
