      { id: 'i6', inv: true, img: 'body_common', grade: '일반', name: '구름 무명옷', kind: '옷', line: '궁술', ilv: 23, base: '생명력 140', baseD: '(+9)', enhNote: '몸 칸 +1 적용 · 실제 생명력 154', opts: [], lost: [{ t: '생명력 +2%' }], power: '장착하면 전투력 −6', price: '190' },
      { id: 'i7', inv: true, img: 'bow_uncommon', grade: '고급', name: '바람결 단궁', kind: '단궁', line: '궁술', ilv: 20, base: '공격력 28', baseD: '(−3)', enhNote: '무기 칸 +2 적용 · 실제 공격력 34', opts: [{ t: '공격력 +1%', r: '[1 – 2]%', d: '(−2%)' }], lost: [{ t: '연사 +1' }], power: '장착하면 전투력 −35', price: '300' },
      { id: 'i8', inv: true, img: 'staff_hero', grade: '영웅', name: '구름 수정 지팡이', kind: '지팡이', line: '마법', ilv: 23, base: '공격력 40', baseD: '(+9)', enhNote: '무기 칸 +2 적용 · 실제 공격력 48', opts: [{ t: '공격력 +6%', r: '[3 – 6]%', d: '(+3%)' }, { t: '축복 마법 전부 +1', r: '마법사 기술 · 효과 없음', off: true }, { t: '생명력 +3%', r: '[3 – 6]%', d: '(+3%)' }], lost: [{ t: '연사 +1' }], power: '장착하면 전투력 +22', price: '2,400', up: true }
    ];
    const deco = (it) => {
      const g = G[it.grade];
      const opts = (it.opts || []).map((o) => ({ t: o.t, r: o.r, d: o.d || '', dColor: col(o.d), textColor: o.off ? '#6E7B8C' : '#E8EDF4', deco: o.off ? 'line-through' : 'none' }));
      const lost = it.lost || [];
      return Object.assign({}, it, {
        real: true, empty: false, color: g.c, tint: g.t, img: IMG[it.img],
        label: it.grade + ' ' + it.kind + ' · ' + it.name,
        sub: it.grade + ' ' + it.kind + ' · ' + it.line + ' 계통',
        meta: '장비 레벨 ' + it.ilv + (it.inv ? ' · 보관함' : ' · 착용 중'),
        baseD: it.baseD || '', baseDColor: col(it.baseD ? it.baseD.replace('(', '') : ''),
        opts: opts, hasOpts: opts.length > 0, lost: lost, hasLost: lost.length > 0,
        unique: it.unique || '', hasUnique: !!it.unique,
        power: it.power || '착용 중인 장비', powerColor: it.power ? col(it.power.replace('장착하면 전투력 ', '')) : '#A7B3C2',
        thirdBtn: it.inv ? '재료로 바꾸기' : '칸 강화',
        inv: !!it.inv, up: !!it.up,
        pick: () => this.setState({ sel: it.id })
      });
    };
    const all = raw.map(deco);
    const byId = {};
    all.forEach((x) => { byId[x.id] = x; });
    const inv = all.filter((x) => x.inv);
    while (inv.length < 24) inv.push({ empty: true, real: false });
    const selId = this.state.sel !== undefined ? this.state.sel : (this.props.initialSelected || null);
    const s = selId && byId[selId] ? byId[selId] : all[0];
    return {
      eqW: byId.eqW, eqH: byId.eqH, eqB: byId.eqB, eqA: byId.eqA,
      inv: inv, s: s, hasSel: !!(selId && byId[selId]),
      close: () => this.setState({ sel: null })
    };
  }
}
