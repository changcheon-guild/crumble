            <div role="note" style="position: relative; background: #1F2A3B; border: 1px solid #3A4E6A; border-radius: 10px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px">

              <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 12px; color: #C8D3E6; white-space: nowrap">전투력 {{f.power}} · {{f.rp}}</span><span style="font-size: 12px; color: #A7B3C2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">"{{f.line}}"</span></span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tip: '', invited: {}, invite: true }; }
  renderVals() {
    const K = '/_blob/05be44623edeece48a014d214caf38a7', R = '/_blob/c2e10fff92a559b32f281532a0025abb', W = '/_blob/65476abc18e3766f1b74c327719c3452';
    const raw = [
      { id: 'a', img: K, name: '바위', cls: '전사', lv: 12, power: '1,240', rp: 'RP 가끔', online: true, here: true, doing: '내 섬에 있어요 · 31번째 구름층', line: '앞은 맡겨.' },
      { id: 'b', img: W, name: '이슬비', cls: '마법사', lv: 10, power: '1,020', rp: 'RP 환영', online: true, doing: '20번째 구름층 · 폭풍의 벽 앞', line: '치유는 걱정 마세요.' },
      { id: 'c', img: R, name: '구름빵', cls: '사냥꾼', lv: 8, power: '760', rp: 'RP 환영', online: true, doing: '하늘지기의 섬에 있어요', line: '같이 놀아요!' },
      { id: 'd', img: K, name: '섬돌', cls: '전사', lv: 6, power: '340', rp: '', online: false, doing: '3시간 전 · 12번째 구름층', line: '처음이라 잘 부탁해요!' }
    ];
    const st = this.state;
    const friends = raw.map((f) => {
      const inv = !!st.invited[f.id];
      return { name: f.name, cls: f.cls, lv: f.lv, img: f.img, doing: f.doing, power: f.power, rp: f.rp || 'RP 안 함', line: f.line,
        on: st.tip === f.id, ring: st.tip === f.id ? '#F2B33D' : '#263243', dot: f.online ? '#6FD08C' : '#5A6B82',
        btnText: f.here ? '섬에 있음' : (inv ? '초대함' : '섬으로 초대'),
        btnBg: (f.here || inv) ? 'transparent' : '#1F3550', btnBorder: (f.here || inv) ? '#3A4658' : '#5A9BE6',
        show: () => this.setState({ tip: f.id }),
        invite: () => { if (f.here) return; const n = Object.assign({}, st.invited); n[f.id] = !inv; this.setState({ invited: n }); } };
    });
    return { friends: friends, hasInvite: st.invite, later: () => this.setState({ invite: false }) };
  }
}
</script>
