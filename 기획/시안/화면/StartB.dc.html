<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>B안 · 처음 시작 · 휴대폰</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8CC4F5}a:hover{color:#B8DBFA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #10161F; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #E8EDF4; display: flex; flex-direction: column; overflow: hidden">

  <section style="height: 200px; position: relative; background-image: url(/_blob/69907e8b4a7316dc4eb78efd37614c75); background-size: 390px auto; background-position: center bottom; image-rendering: pixelated; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 20px 16px">
    <span style="font-size: 13px; font-weight: 700; color: #10304A">하늘 군도에 온 걸 환영해요</span>
    <h1 style="margin: 4px 0 0; font-family: 'Gowun Batang', serif; font-size: 26px; font-weight: 700; color: #10304A">어떤 모험가가 될까요?</h1>
  </section>

  <main style="flex: 1; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="nick" style="font-size: 14px; font-weight: 700">닉네임</label>
      <div style="display: flex; align-items: center; gap: 8px; background: #151D29; border: 2px solid #5A9BE6; border-radius: 10px; padding: 0 12px; min-height: 50px">
        <input id="nick" type="text" value="구름사냥꾼" maxlength="10" style="flex: 1; min-width: 0; border: none; background: transparent; color: #E8EDF4; font: inherit; font-size: 16px; outline: none">
        <span style="font-size: 12px; color: #A7B3C2">5 / 10</span>
      </div>
      <span style="font-size: 13px; color: #6FD08C; font-weight: 500">사용할 수 있는 닉네임이에요</span>
      <span style="font-size: 12px; color: #A7B3C2">2~10자 · 한글·영문·숫자 · 다른 모험가와 겹칠 수 없어요</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 700">직업</span>
      <div role="radiogroup" aria-label="직업" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{classes}}" as="k" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{k.on}}" onClick="{{k.pick}}" style="border-radius: 12px; border: 2px solid {{k.border}}; background: {{k.bg}}; padding: 10px 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; color: #E8EDF4; cursor: pointer; min-height: 160px">
            <img src="{{k.img}}" alt="" width="64" height="64" style="image-rendering: pixelated">
            <span style="font-size: 16px; font-weight: 700">{{k.name}}</span>
            <span style="font-size: 12px; color: #A7B3C2; line-height: 1.4">{{k.role}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <article style="background: #151D29; border: 1px solid #263243; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; font-weight: 700">{{sel.name}} · {{sel.pos}}</span>
      <span style="font-size: 13px; color: #C8D3E6; line-height: 1.5">{{sel.desc}}</span>
    </article>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #F3D08A; text-align: center">직업은 나중에 바꿀 수 없어요. 어느 직업이든 강함은 같아요.</span>
      <button type="button" style="min-height: 52px; border-radius: 12px; border: none; background: #3D86C6; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 700">{{sel.btn}}</button>
      <span style="font-size: 12px; color: #A7B3C2; text-align: center">내 캐릭터 모습은 시작한 뒤 직접 도트로 그릴 수 있어요</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 'hunter' };
  }
  renderVals() {
    const B = '/_blob/';
    const list = [
      { id: 'warrior', name: '전사', img: B + 'f890d1d3b0ebe5b55e3f3b00f8ebb691', btn: '전사로 시작하기', role: '앞에서 동료를 지켜요', pos: '앞줄', desc: '섬에 내리면 맨 앞에 서서 방패로 적의 공격을 막아요. 보스의 공격을 가장 많이 받아 내요.' },
      { id: 'hunter', name: '사냥꾼', img: B + '64ae9ed81130ea20c79ff61a7efd0c61', btn: '사냥꾼으로 시작하기', role: '멀리서 활을 쏴요', pos: '뒷줄', desc: '긴 활로 구름 너머의 적을 맞혀요. 가장 큰 피해 숫자를 내는 직업이에요.' },
      { id: 'mage', name: '마법사', img: B + '34b6b35084770f950ac747214e2463a9', btn: '마법사로 시작하기', role: '공격·치유·축복을 배워요', pos: '뒷줄', desc: '공격 마법으로 싸우거나, 치유 마법으로 동료를 지키거나, 축복 마법으로 동료를 강하게 해요.' }
    ];
    const cur = this.state.pick;
    const classes = list.map((k) => Object.assign({}, k, {
      on: k.id === cur,
      border: k.id === cur ? '#8CC4F5' : '#263243',
      bg: k.id === cur ? '#1B2B40' : '#151D29',
      pick: () => this.setState({ pick: k.id })
    }));
    const sel = classes.filter((k) => k.on)[0];
    return { classes: classes, sel: sel };
  }
}
</script>
</body>
</html>
