<html lang="ko">
<head>
<meta charset="utf-8">

<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Galmuri11';src:url(/_blob/3d7d41766d6fe4ab874aa2af55b7545e) format('woff2');font-weight:400;font-display:swap}@font-face{font-family:'Galmuri11';src:url(/_blob/8457e27020c70d82c86e28af69c16a56) format('woff2');font-weight:700;font-display:swap}@font-face{font-family:'Galmuri14';src:url(/_blob/b67fdc63fa51b5e3d8ffaa0aa94ab0fc) format('woff2');font-weight:100 900;font-display:swap}body{-webkit-font-smoothing:none}button,input,select,textarea{font-family:inherit}

body{margin:0}
a{color:#8CC4F5}a:hover{color:#B8DBFA}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #10161F; font-family: 'Galmuri11', 'Noto Sans KR', system-ui, sans-serif; color: #E8EDF4">
  <header style="background: #151D29; border-bottom: 1px solid #263243">
    <div style="max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 10px 24px; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 10px">
        <img src="/_blob/c2e10fff92a559b32f281532a0025abb" alt="" width="32" height="32" style="image-rendering: pixelated">
        <span style="font-family: 'Galmuri14', 'Galmuri11', sans-serif; font-size: 20px; font-weight: 700">[닉네임]</span>
        <span style="font-size: 13px; color: #A7B3C2">사냥꾼 · Lv 10 · 전투력 1,054</span>
      </div>
      <div style="display: flex; gap: 18px; font-size: 14px; font-weight: 500; align-items: center">
        <span style="display: flex; align-items: center; gap: 4px"><img src="/_blob/f455ad14c4095214ee4a4ff7129ab42b" alt="골드" width="34" height="34" style="image-rendering: pixelated">12,400</span>
        <span style="display: flex; align-items: center; gap: 4px"><img src="/_blob/b57b5fdadf690adfcf48b45d05b6dd29" alt="하늘돌" width="34" height="34" style="image-rendering: pixelated">36</span>
        <span style="display: flex; align-items: center; gap: 4px"><img src="/_blob/7302eda7e37a9db3d859ef3a49cf94a1" alt="구름 수정" width="34" height="34" style="image-rendering: pixelated">4</span>
      </div>
    </div>
  </header>

  <div style="max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

    <nav aria-label="주 메뉴" style="flex: 1 1 180px; max-width: 220px; background: #151D29; border: 1px solid #263243; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 2px">
      <a href="HomePCB.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; color: #C9D3DE; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 L12 4 L21 11"></path><path d="M5 10 V20 H19 V10"></path></svg>집</a>
      <a href="ExpeditionPCB.dc.html" aria-current="page" style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; background: #1F2A44; color: #8CC4F5; font-weight: 700; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3 V15"></path><path d="M7 10 L12 15 L17 10"></path><path d="M4 20 H20"></path></svg>원정</a>
      <a href="GearPCB.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; color: #C9D3DE; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3 L19 6 V12 C19 16 16 19 12 21 C8 19 5 16 5 12 V6 Z"></path></svg>장비</a>
      <a href="SocialPCB.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; color: #C9D3DE; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3 19 C3 15 6 13 9 13 C12 13 15 15 15 19"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16 13.5 C19 13.5 21 15.5 21 19"></path></svg>교류</a>
      <a href="MarketPCB.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; color: #C9D3DE; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8 H20 L18 20 H6 Z"></path><path d="M9 8 V6 A3 3 0 0 1 15 6 V8"></path></svg>거래소</a>
      <a href="#settings" style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 8px; color: #C9D3DE; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3 V6 M12 18 V21 M3 12 H6 M18 12 H21"></path></svg>설정</a>
    </nav>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <span style="font-family: 'Galmuri14', 'Galmuri11', sans-serif; font-size: 22px; font-weight: 700">큰 토벌</span>


  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; align-items: start">

    <article style="background: #1A1F33; border: 1px solid #3A3F66; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; gap: 12px; align-items: center">
        <div style="width: 60px; height: 60px; flex-shrink: 0; border-radius: 12px; background: #262B48; display: flex; align-items: center; justify-content: center"><img src="/_blob/5919c11916a5b09d0838114c0b310e8f" alt="" width="48" height="48" style="image-rendering: pixelated"></div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'Galmuri14', 'Galmuri11', sans-serif; font-size: 16px; font-weight: 700">먹구름 날개 무리</span>
          <span style="font-size: 12px; color: #C8D3E6">쓰러지지 않아요. 60초 동안 준 피해가 기록이 돼요</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
        <div style="background: #262B48; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column"><span style="font-size: 11px; color: #A7B3C2; white-space: nowrap">{{g.name}} 최고</span><span style="font-size: 16px; font-weight: 700; color: #F3D08A">{{g.best}}</span></div>
        <div style="background: #262B48; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column"><span style="font-size: 11px; color: #A7B3C2">오늘 예상</span><span style="font-size: 16px; font-weight: 700">{{g.expect}} <span style="font-size: 12px; color: {{g.diffColor}}">{{g.diff}}</span></span></div>
      </div>
    </article>

    <div role="tablist" aria-label="어디서 가나" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{srcs}}" as="g" hint-placeholder-count="2">
        <button type="button" role="tab" aria-selected="{{g.on}}" onClick="{{g.pick}}" style="min-height: 40px; border-radius: 10px; border: 2px solid {{g.border}}; background: {{g.bg}}; color: #E8EDF4; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap">{{g.name}}</button>
      </sc-for>
    </div>

    <section aria-label="무리" style="background: #151D29; border: 1px solid #263243; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 14px; font-weight: 700; white-space: nowrap">{{boardTitle}}</span>
        <span style="font-size: 12px; color: #A7B3C2; white-space: nowrap">{{boardNote}}</span>
      </div>
      <sc-for list="{{teams}}" as="tm" hint-placeholder-count="1">
        <div style="display: flex; gap: 6px; align-items: center">
          <span style="width: 34px; flex-shrink: 0; font-size: 11px; color: #A7B3C2; white-space: nowrap">{{tm.label}}</span>
          <div style="flex: 1; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px">
            <sc-for list="{{tm.seats}}" as="m" hint-placeholder-count="8">
              <button type="button" onClick="{{m.take}}" aria-label="{{m.name}}" style="aspect-ratio: 1; box-sizing: border-box; padding: 0; border-radius: 5px; border: {{m.border}}; background: {{m.bg}}; display: flex; align-items: center; justify-content: center; cursor: {{m.cursor}}">
                <sc-if value="{{m.filled}}" hint-placeholder-val="{{ true }}"><img src="{{m.img}}" alt="" width="32" height="32" style="image-rendering: pixelated; width: 85%; height: auto"></sc-if>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <button type="button" onClick="{{toggle}}" style="min-height: 44px; border-radius: 10px; border: {{btnBorder}}; background: {{btnBg}}; color: {{btnColor}}; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap">{{btnText}}</button>
    </section>

    <section aria-label="기록 보상" style="background: #151D29; border: 1px solid #263243; border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 700">오늘 예상 보상 <span style="font-size: 12px; font-weight: 400; color: #A7B3C2">기록만큼 · 모두 같게</span></span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 11px">
        <sc-for list="{{rewards}}" as="r" hint-placeholder-count="4">
          <button type="button" onClick="{{r.show}}" onMouseEnter="{{r.show}}" aria-expanded="{{r.on}}" aria-label="{{r.label}} 설명 보기" style="display: flex; flex-direction: column; align-items: center; gap: 4px; border: none; background: transparent; color: #E8EDF4; font-size: 11px; padding: 0; cursor: pointer">
            <span style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 8px; border: {{r.border}}; display: flex; align-items: center; justify-content: center"><img src="{{r.img}}" alt="" width="34" height="34" style="image-rendering: pixelated; filter: drop-shadow(1px 0 0 #0A0E14) drop-shadow(-1px 0 0 #0A0E14) drop-shadow(0 1px 0 #0A0E14) drop-shadow(0 -1px 0 #0A0E14)"></span>
            <span>{{r.label}}</span>
          </button>
        </sc-for>
      </div>
      <sc-if value="{{tipOn}}" hint-placeholder-val="{{ false }}">
        <div role="note" style="position: relative; margin-top: 4px; background: #1F2A3B; border: 1px solid #3A4E6A; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
          <span aria-hidden="true" style="position: absolute; top: -7px; left: {{tip.arrow}}; width: 12px; height: 12px; margin-left: -6px; background: #1F2A3B; border-left: 1px solid #3A4E6A; border-top: 1px solid #3A4E6A; transform: rotate(45deg)"></span>
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-size: 14px; font-weight: 700; color: {{tip.color}}">{{tip.title}}</span>
            <button type="button" onClick="{{closeTip}}" aria-label="설명 닫기" style="width: 32px; height: 32px; margin: -6px -6px -6px 0; border: none; background: transparent; color: #A7B3C2; font: inherit; font-size: 14px; cursor: pointer">✕</button>
          </div>
          <span style="font-size: 12px; color: #C8D3E6; line-height: 1.6">{{tip.body}}</span>
          <sc-if value="{{tip.hasLink}}" hint-placeholder-val="{{ false }}"><a href="{{tip.href}}" style="font-size: 13px; font-weight: 700; align-self: flex-start; min-height: 32px; display: flex; align-items: center">{{tip.link}} ›</a></sc-if>
        </div>
      </sc-if>
    </section>
  </div>


    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { src: 'guild', on: true, team: -1, tip: -1 }; }
  renderVals() {
    const K = '/_blob/05be44623edeece48a014d214caf38a7', R = '/_blob/c2e10fff92a559b32f281532a0025abb', W = '/_blob/65476abc18e3766f1b74c327719c3452';
    const fmt = (n) => n.toLocaleString('ko-KR');
    const st = this.state;
    const isG = st.src === 'guild';
    // 길드: 섬에 와 있는 길드원 13명을 들어온 순서로 8명씩 채운다. 직접 고른 자리가 있으면 그 무리에 먼저 넣는다.
    const pool = isG ? [K, R, W, K, R, W, K, R, W, K, R, W, K].map((img, i) => ({ img: img, name: '길드원 ' + (i + 1) })) : [{ img: R, name: '노을' }, { img: K, name: '바위' }, { img: W, name: '레아' }];
    const nTeams = isG ? 4 : 1;
    const teams = [];
    for (let t = 0; t < nTeams; t++) teams.push([]);
    const me = st.on ? { img: R, name: '나', me: true } : null;
    let rest = pool.slice();
    if (me && st.team >= 0 && st.team < nTeams) teams[st.team].push(me);
    else if (me) rest.push(me);
    for (const m of rest) { const t = teams.findIndex((x) => x.length < 8); if (t >= 0) teams[t].push(m); }
    const record = (n) => n ? Math.round(48000 * n * (1 - n * 0.015)) : 0;
    const teamVals = teams.map((list, t) => ({ label: isG ? (t + 1) + '무리' : '모임',
      seats: [0, 1, 2, 3, 4, 5, 6, 7].map((k) => {
        const m = list[k];
        if (m) return { filled: true, img: m.img, name: m.name, border: m.me ? '2px solid #F2B33D' : '1px solid #3A4658', bg: '#1B2433', cursor: 'default', take: () => {} };
        return { filled: false, img: '', name: (t + 1) + '무리 빈자리', border: '1px dashed #3A4658', bg: 'transparent', cursor: isG && st.on ? 'pointer' : 'default', take: () => { if (isG && st.on) this.setState({ team: t }); } };
      }) }));
    const myTeam = teams.findIndex((x) => x.some((m) => m.me));
    const myCount = myTeam >= 0 ? teams[myTeam].length : 0;
    const best = isG ? 412800 : 182400;
    const expect = isG ? teams.reduce((a, x) => a + record(x.length), 0) : record(myCount || pool.length);
    const d = Math.round((expect - best) / best * 1000) / 10;
    const myRec = record(myCount);
    const raw = [
      { label: '구름 수정 ' + Math.floor(myRec / 20000), img: '/_blob/7302eda7e37a9db3d859ef3a49cf94a1', title: '구름 수정 ' + Math.floor(myRec / 20000) + '개', body: '내 무리 기록에 따라 받아요. 기록 2만마다 1개.' },
      { label: '골드 ' + fmt(Math.floor(myRec / 40)), img: '/_blob/f455ad14c4095214ee4a4ff7129ab42b', title: '골드 ' + fmt(Math.floor(myRec / 40)), body: '내 무리 기록에 따라 받아요.' }
    ];
    const i = st.tip, tt = raw[i] || raw[0];
    const total = teams.reduce((a, x) => a + x.length, 0);
    return {
      srcs: [['guild', '하늘등대 길드 섬'], ['island', '노을의 섬']].map((x) => ({ name: x[1], on: st.src === x[0], border: st.src === x[0] ? '#E0A93B' : '#3A4658', bg: st.src === x[0] ? '#2A2312' : '#151D29', pick: () => this.setState({ src: x[0], team: -1 }) })),
      g: { name: isG ? '하늘등대' : '노을의 섬 모임', best: fmt(best), expect: fmt(expect), diff: (d >= 0 ? '+' : '') + d + '%', diffColor: d >= 0 ? '#6FD08C' : '#F08A8A' },
      boardTitle: isG ? '무리 · 지금 ' + total + ' / 32명' : '지금 섬에 모인 사람 ' + total + ' / 8',
      boardNote: isG ? '빈칸을 누르면 그 무리로 · 안 고르면 자동' : '22:00 출발',
      teams: teamVals,
      btnText: st.on ? (isG ? '섬에 머무는 중 · ' + (myTeam + 1) + '무리' + (st.team >= 0 ? ' (고름)' : ' (자동)') : '섬에 머무는 중 · 모임에서 빠지기') : (isG ? '하늘등대로 건너가기' : '노을의 섬으로 건너가기'),
      btnBg: st.on ? 'transparent' : '#F2B33D', btnColor: st.on ? '#E8EDF4' : '#1B2735', btnBorder: st.on ? '1px solid #8FA3C4' : 'none',
      toggle: () => this.setState({ on: !st.on, team: -1 }),
      rewards: raw.map((r, k) => ({ label: r.label, img: r.img, on: i === k, border: i === k ? '2px solid #F2B33D' : '1px solid #263243', show: () => this.setState({ tip: k }) })),
      tipOn: i >= 0, closeTip: () => this.setState({ tip: -1 }),
      tip: { title: tt.title, color: '#E8EDF4', body: tt.body, hasLink: false, href: '', link: '', arrow: (12.5 + 25 * Math.max(i, 0)) + '%' }
    };
  }
}

</script>
